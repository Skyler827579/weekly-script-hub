<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChainPulse｜工具 / SaaS</title>
  <style>
    :root{
      --bg:#f7f9fc;
      --paper:rgba(255,255,255,.80);
      --paper2:rgba(255,255,255,.92);
      --line:rgba(16,24,40,.10);
      --text:#101828;
      --muted:#5d6677;
      --purple:#b620e0;
      --blue:#2f80ff;
      --cyan:#14d5cc;
      --green:#62da6e;
      --grad:linear-gradient(135deg,#b620e0 0%,#2f80ff 35%,#14d5cc 68%,#62da6e 100%);
      --shadow:0 18px 60px rgba(18,27,54,.08);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:"Avenir Next","SF Pro Display","PingFang SC","Helvetica Neue",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 14% 18%, rgba(182,32,224,.09), transparent 22%),
        radial-gradient(circle at 84% 16%, rgba(47,128,255,.09), transparent 22%),
        radial-gradient(circle at 72% 76%, rgba(20,213,204,.12), transparent 20%),
        linear-gradient(180deg,#fbfdff 0%,#f5f7fb 100%);
      min-height:100vh;
    }
    .wrap{width:min(1240px,calc(100% - 36px));margin:24px auto 48px}
    .top-nav{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
    .top-nav a{
      padding:12px 16px;border-radius:999px;background:rgba(255,255,255,.82);
      border:1px solid var(--line);font-size:14px;box-shadow:0 8px 24px rgba(15,23,42,.05)
    }
    .hero,.panel,.card,.side,.logic,.data{
      background:var(--paper);backdrop-filter:blur(18px);
      border:1px solid var(--line);box-shadow:var(--shadow)
    }
    .hero{padding:34px;border-radius:32px;overflow:hidden;position:relative;margin-bottom:20px}
    .hero:after{
      content:"";position:absolute;right:-120px;top:-120px;width:320px;height:320px;
      background:var(--grad);opacity:.12;filter:blur(36px);border-radius:50%
    }
    .brand{display:flex;align-items:center;gap:16px;margin-bottom:18px}
    .mark{
      width:74px;height:74px;border-radius:24px;background:rgba(255,255,255,.88);
      display:grid;place-items:center;border:1px solid rgba(255,255,255,.75);box-shadow:0 16px 40px rgba(47,128,255,.10)
    }
    .kicker{
      display:inline-block;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.80);
      border:1px solid var(--line);color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px
    }
    h1{margin:0;font-size:clamp(34px,6vw,70px);line-height:.98;letter-spacing:-.04em}
    .accent{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
    .hero p{margin:16px 0 0;max-width:860px;color:var(--muted);font-size:16px;line-height:1.9}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:24px}
    .stat{padding:18px;border-radius:22px;background:rgba(255,255,255,.86);border:1px solid var(--line)}
    .stat .label{font-size:12px;color:var(--muted);margin-bottom:10px;letter-spacing:.06em;text-transform:uppercase}
    .stat .value{font-size:24px;font-weight:700;letter-spacing:-.03em}
    .grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px}
    .stack,.category-grid,.post-grid{display:grid;gap:16px}
    .panel,.side,.card{padding:24px;border-radius:26px}
    .panel h2,.title2{margin:0 0 14px;font-size:34px;letter-spacing:-.04em}
    .panel p,.panel li,.side p,.side li{color:var(--muted);line-height:1.85;font-size:14px}
    .panel ul,.side ul{margin:0;padding-left:18px}
    .category-grid{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
    .cat{
      position:relative;padding:20px;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.76));
      border:1px solid var(--line);box-shadow:0 14px 36px rgba(16,24,40,.05);min-height:188px
    }
    .cat:before{content:"";position:absolute;left:0;top:0;width:100%;height:4px;background:var(--grad)}
    .cat h3{margin:0 0 10px;font-size:20px;letter-spacing:-.03em}
    .cat p{margin:0;color:var(--muted);line-height:1.8}
    .cat .count{position:absolute;bottom:18px;left:20px;font-size:14px;font-weight:600}
    .post-grid{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
    .card{position:relative;overflow:hidden}
    .card:after{
      content:"";position:absolute;inset:0;border-radius:26px;padding:1px;
      background:linear-gradient(135deg,rgba(182,32,224,.22),rgba(47,128,255,.12),rgba(20,213,204,.22));
      -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none
    }
    .meta,.chips{display:flex;flex-wrap:wrap;gap:8px}
    .pill,.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.76);font-size:12px}
    .card h3{margin:14px 0 10px;font-size:28px;line-height:1.18;letter-spacing:-.04em}
    .summary{margin:0;color:var(--muted);line-height:1.85;font-size:15px}
    .detail{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px}
    .side{position:sticky;top:20px;height:fit-content}
    .side h3{margin:0 0 12px;font-size:18px;letter-spacing:-.02em}
    .article{padding:28px;border-radius:28px}
    .article h1{font-size:clamp(28px,5vw,56px);line-height:1.02;margin:16px 0 12px}
    .lead{color:var(--muted);line-height:1.9;font-size:16px;margin:0 0 16px}
    .section{border-top:1px solid var(--line);margin-top:18px;padding-top:18px}
    .section h2{margin:0 0 12px;font-size:22px;letter-spacing:-.03em}
    .section p{margin:0 0 14px;line-height:1.95}
    .section ul{margin:0;padding-left:18px}
    .section li{line-height:1.9;margin-bottom:6px}
    .logic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
    .logic,.data{padding:16px;border-radius:22px}
    .logic .k,.data .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
    .logic .v{font-size:15px;line-height:1.8}
    .data-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
    .data .v{font-size:24px;font-weight:700;letter-spacing:-.03em}
    .quote,.warn{border-radius:22px;padding:18px;line-height:1.9}
    .quote{background:linear-gradient(180deg,rgba(47,128,255,.08),rgba(20,213,204,.08));border:1px solid rgba(47,128,255,.16)}
    .warn{background:linear-gradient(180deg,rgba(182,32,224,.08),rgba(255,166,0,.08));border:1px solid rgba(182,32,224,.14)}
    .note{margin-top:18px;color:var(--muted);font-size:13px;line-height:1.7}
    @media (max-width:980px){
      .grid,.detail{grid-template-columns:1fr}
      .side{position:static}
      .hero{padding:24px}
      h1{font-size:clamp(32px,11vw,56px)}
    }
    </style>
</head>
<body>
